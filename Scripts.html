<script>
(function(){
'use strict';
var state={foremen:[],foreman:null,objects:[],object:null,requirements:[],files:{},maxMb:10,sending:false};
var $=function(id){return document.getElementById(id)};
function call(name){var args=[].slice.call(arguments,1);return new Promise(function(resolve,reject){var runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);runner[name].apply(runner,args)})}
function unwrap(response){if(!response||!response.ok)throw new Error(response&&response.message||'Сервер вернул некорректный ответ.');return response.data}
function escapeHtml(value){return String(value==null?'':value).replace(/[&<>'"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
function toast(message,error){var node=$('toast');node.textContent=message;node.className='toast'+(error?' error':'');node.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(function(){node.hidden=true},5000)}
function show(id){document.querySelectorAll('.screen').forEach(function(el){el.hidden=true});$('loading').hidden=true;$(id).hidden=false;window.scrollTo(0,0)}
function selectedEntries(){return state.requirements.filter(function(r){return state.files[r.id]&&state.files[r.id].length})}
function renderForemen(){var root=$('foremen');root.innerHTML=state.foremen.map(function(f){return '<button class="select-card'+(state.foreman&&state.foreman.id===f.id?' selected':'')+'" data-foreman="'+escapeHtml(f.id)+'"><span class="card-title">'+escapeHtml(f.name)+'</span></button>'}).join('');$('foremen-empty').hidden=!!state.foremen.length;$('foreman-next').disabled=!state.foreman}
function selectForeman(id){state.foreman=state.foremen.find(function(f){return f.id===id});state.object=null;state.files={};renderForemen()}
function loadObjects(){showLoading();call('getObjectsByForeman',state.foreman.id).then(unwrap).then(function(data){state.objects=data;renderObjects();show('step-2')}).catch(handleError)}
function renderObjects(){var root=$('objects');root.className='cards objects';root.innerHTML=state.objects.map(function(o){return '<button class="select-card'+(state.object&&state.object.id===o.id?' selected':'')+'" data-object="'+escapeHtml(o.id)+'"><span class="card-title">'+escapeHtml(o.name)+'</span><span class="card-detail">'+escapeHtml(o.address)+'</span><span class="badge active">✓ '+escapeHtml(o.status)+'</span></button>'}).join('');$('objects-caption').textContent=state.foreman.name;$('objects-empty').hidden=!!state.objects.length;$('object-next').disabled=!state.object}
function loadRequirements(refresh){showLoading();if(refresh)state.files={};call('getObjectState',state.object.id,state.foreman.id).then(unwrap).then(function(data){state.requirements=data.requirements;state.object=data.object;state.maxMb=data.maxFileSizeMb;renderRequirements();show('step-3')}).catch(handleError)}
function renderRequirements(){
 $('object-summary').innerHTML='<p><strong>'+escapeHtml(state.foreman.name)+'</strong></p><p>'+escapeHtml(state.object.name)+'</p><p>'+escapeHtml(state.object.address)+'</p>';
 var html='';['Запуск объекта','Завершение объекта'].forEach(function(stage){var rows=state.requirements.filter(function(r){return r.stage===stage});if(!rows.length)return;html+='<h2 class="stage">'+escapeHtml(stage)+'</h2>';rows.forEach(function(r){var provided=r.status==='Предоставлено';html+='<article class="requirement-card"><div class="requirement-top"><div><strong class="card-title">'+escapeHtml(r.name)+'</strong><div class="category">'+escapeHtml(r.category)+'</div></div><span class="badge '+(provided?'provided':'missing')+'">'+(provided?'✓ ':'')+escapeHtml(r.status)+'</span></div>';if(!provided){html+='<label class="drop-zone">Выбрать один или несколько файлов<input type="file" multiple data-file-input="'+escapeHtml(r.id)+'"></label><ul class="file-list">'+fileListHtml(r.id)+'</ul>'}html+='</article>'})});
 $('requirements').innerHTML=html;$('requirements-empty').hidden=!!state.requirements.length;updateContinue()}
function fileListHtml(id){return(state.files[id]||[]).map(function(file,index){return '<li class="file-item"><span>'+escapeHtml(file.name)+'</span><button class="remove-file" data-remove="'+escapeHtml(id)+'" data-index="'+index+'" aria-label="Удалить файл">Удалить</button></li>'}).join('')}
function addFiles(id,list){var accepted=[];Array.prototype.forEach.call(list,function(file){if(file.size>state.maxMb*1024*1024){toast('Файл «'+file.name+'» превышает допустимый размер '+state.maxMb+' МБ.',true)}else accepted.push(file)});state.files[id]=(state.files[id]||[]).concat(accepted);renderRequirements()}
function updateContinue(){$('confirm-next').disabled=!selectedEntries().length}
function renderConfirmation(){var entries=selectedEntries(),count=entries.reduce(function(n,r){return n+state.files[r.id].length},0);$('confirm-summary').innerHTML='<p><strong>'+escapeHtml(state.foreman.name)+'</strong></p><p>'+escapeHtml(state.object.name)+'</p><p>Обязательных позиций: <strong>'+entries.length+'</strong></p><p>Физических файлов: <strong>'+count+'</strong></p>';$('confirmation').innerHTML=entries.map(function(r){return '<article class="confirm-card"><div class="category">'+escapeHtml(r.stage)+' · '+escapeHtml(r.category)+'</div><strong class="card-title">'+escapeHtml(r.name)+'</strong><ul>'+state.files[r.id].map(function(f){return'<li>'+escapeHtml(f.name)+'</li>'}).join('')+'</ul></article>'}).join('');show('step-4')}
function readFile(file){return new Promise(function(resolve,reject){var reader=new FileReader();reader.onload=function(){resolve({name:file.name,mimeType:file.type||'application/octet-stream',base64:String(reader.result).replace(/^data:[^;]+;base64,/,'')})};reader.onerror=function(){reject(new Error('Не удалось прочитать файл «'+file.name+'».'))};reader.readAsDataURL(file)})}
async function send(){state.sending=true;$('send').disabled=true;$('confirm-back').disabled=true;$('sending').hidden=false;var results=[],entries=selectedEntries();for(var i=0;i<entries.length;i++){var r=entries[i];try{var files=[];for(var j=0;j<state.files[r.id].length;j++)files.push(await readFile(state.files[r.id][j]));var data=unwrap(await call('uploadRequirementFiles',{foremanId:state.foreman.id,objectId:state.object.id,requirementId:r.id,files:files}));results.push({ok:true,name:r.name,count:data.uploadedFileCount})}catch(error){results.push({ok:false,name:r.name,count:0,message:error.message||String(error)})}}var remaining=null;try{remaining=unwrap(await call('getRemainingRequirementCount',state.object.id,state.foreman.id)).count}catch(error){toast('Не удалось получить остаток позиций: '+error.message,true)}state.sending=false;$('sending').hidden=true;renderResult(results,remaining)}
function renderResult(results,remaining){var success=results.filter(function(r){return r.ok}),failed=results.filter(function(r){return!r.ok}),files=success.reduce(function(n,r){return n+r.count},0);$('result-summary').innerHTML=metric(success.length,'позиций предоставлено')+metric(files,'файлов загружено')+metric(failed.length,'позиций с ошибкой')+metric(remaining==null?'—':remaining,'позиций осталось');$('result-items').innerHTML=results.map(function(r){return'<div class="result-row'+(r.ok?'':' error')+'"><strong>'+(r.ok?'Загружено':'Ошибка загрузки')+':</strong> '+escapeHtml(r.name)+(r.message?'<div>'+escapeHtml(r.message)+'</div>':'')+'</div>'}).join('');state.files={};show('result')}
function metric(n,label){return'<div class="metric"><strong>'+escapeHtml(n)+'</strong><span>'+escapeHtml(label)+'</span></div>'}
function showLoading(){$('loading').hidden=false;document.querySelectorAll('.screen').forEach(function(el){el.hidden=true})}
function handleError(error){show(state.foreman?'step-2':'step-1');toast(error.message||String(error),true)}
function restart(){state.foreman=null;state.object=null;state.files={};renderForemen();show('step-1')}
document.addEventListener('click',function(e){var foreman=e.target.closest('[data-foreman]');if(foreman)selectForeman(foreman.dataset.foreman);var object=e.target.closest('[data-object]');if(object){state.object=state.objects.find(function(o){return o.id===object.dataset.object});state.files={};renderObjects()}var remove=e.target.closest('[data-remove]');if(remove){state.files[remove.dataset.remove].splice(Number(remove.dataset.index),1);renderRequirements()}});
document.addEventListener('change',function(e){if(e.target.matches('[data-file-input]'))addFiles(e.target.dataset.fileInput,e.target.files)});
$('foreman-next').onclick=loadObjects;$('objects-back').onclick=function(){show('step-1')};$('object-next').onclick=function(){loadRequirements(true)};$('files-back').onclick=function(){state.files={};show('step-2')};$('confirm-next').onclick=renderConfirmation;$('confirm-back').onclick=function(){if(!state.sending)show('step-3')};$('send').onclick=send;$('continue-object').onclick=function(){loadRequirements(true)};$('other-object').onclick=function(){state.object=null;renderObjects();show('step-2')};$('restart').onclick=restart;
call('getForemen').then(unwrap).then(function(data){state.foremen=data;renderForemen();show('step-1')}).catch(function(error){$('loading').innerHTML='<div class="empty">Не удалось загрузить приложение.<br>'+escapeHtml(error.message||error)+'</div>';toast(error.message||String(error),true)});
})();
</script>
