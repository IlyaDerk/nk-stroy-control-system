<style>
:root{--navy:#17345d;--blue:#2563a9;--light:#f3f6fa;--line:#dce3eb;--text:#172033;--muted:#64748b;--green:#26734d;--green-bg:#e8f5ee;--orange:#a7550b;--orange-bg:#fff4e5;--red:#b42318;--red-bg:#fef0ef;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--light);color:var(--text);font:16px/1.45 Arial,sans-serif}.app{width:100%;max-width:760px;min-height:100vh;margin:0 auto;padding:16px;background:var(--white);box-shadow:0 0 30px rgba(23,52,93,.08)}.brand{display:flex;align-items:center;gap:12px;padding:4px 0 22px;border-bottom:1px solid var(--line)}.brand-mark{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--navy);color:#fff;font-weight:800}.brand strong,.brand small{display:block}.brand small{color:var(--muted);font-size:13px}.screen{padding-top:22px}.progress{margin:0;color:var(--blue);font-size:14px;font-weight:700}.progress-track{height:5px;margin:8px 0 24px;background:#e8edf3;border-radius:9px;overflow:hidden}.progress-track i{display:block;height:100%;background:var(--blue)}h1{margin:0 0 8px;font-size:26px;line-height:1.2}.lead{margin:0 0 22px;color:var(--muted)}.cards{display:grid;gap:12px}.select-card,.requirement-card,.confirm-card{width:100%;padding:18px;text-align:left;border:2px solid var(--line);border-radius:14px;background:#fff;color:inherit}.select-card{cursor:pointer}.select-card:hover,.select-card.selected{border-color:var(--blue);background:#f3f8ff}.select-card.selected{box-shadow:0 0 0 3px rgba(37,99,169,.12)}.card-title{display:block;font-size:17px;font-weight:700}.card-detail{display:block;margin-top:5px;color:var(--muted);font-size:14px}.badge{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:5px 9px;border-radius:99px;font-size:13px;font-weight:700}.badge.active,.badge.provided{color:var(--green);background:var(--green-bg)}.badge.missing{color:var(--orange);background:var(--orange-bg)}.actions{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px;padding:14px 0 calc(4px + env(safe-area-inset-bottom));background:#fff}.actions.one{grid-template-columns:1fr}button{min-height:50px;border:0;border-radius:12px;padding:12px 16px;font:700 15px Arial,sans-serif;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{border:1px solid #b9c5d3;background:#fff;color:var(--navy)}button:disabled{cursor:not-allowed;opacity:.48}.summary{margin:16px 0 24px;padding:16px;border-radius:12px;background:#edf4fc}.summary p{margin:3px 0}.stage{margin:24px 0 12px;font-size:20px}.requirement-card{margin-bottom:12px}.requirement-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.requirement-top .badge{flex:none;margin:0}.category{margin-top:5px;color:var(--muted);font-size:14px}.drop-zone{display:block;margin-top:15px;padding:18px 12px;border:2px dashed #9eb3ca;border-radius:10px;text-align:center;color:var(--blue);font-weight:700;cursor:pointer}.drop-zone input{position:absolute;width:1px;height:1px;opacity:0}.file-list{margin:12px 0 0;padding:0;list-style:none}.file-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}.remove-file{min-height:34px;padding:5px 9px;background:var(--red-bg);color:var(--red)}.confirm-card{margin-bottom:12px}.confirm-card ul{margin:9px 0 0;padding-left:22px}.empty{padding:25px;border:1px dashed #aebdca;border-radius:12px;text-align:center;color:var(--muted)}.loading,.sending{display:flex;align-items:center;justify-content:center;gap:12px;padding:30px 10px;color:var(--muted)}.spinner{width:24px;height:24px;border:3px solid #d9e2ec;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;z-index:10;top:16px;left:50%;width:calc(100% - 32px);max-width:700px;transform:translateX(-50%);padding:14px 18px;border-radius:10px;background:var(--navy);color:#fff;box-shadow:0 8px 25px #0003}.toast.error{background:var(--red)}.result-icon{display:grid;place-items:center;width:62px;height:62px;margin:0 0 16px;border-radius:50%;background:var(--green-bg);color:var(--green);font-size:35px;font-weight:800}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.metric{padding:14px;border-radius:12px;background:var(--light)}.metric strong{display:block;font-size:26px}.metric span{font-size:13px;color:var(--muted)}.result-row{margin:10px 0;padding:14px;border-radius:10px;background:var(--green-bg);color:var(--green)}.result-row.error{background:var(--red-bg);color:var(--red)}.result-actions{display:grid;gap:10px;margin-top:22px}.text-button{background:transparent;color:var(--blue)}@media(min-width:600px){.app{padding:24px 36px}.cards.objects{grid-template-columns:1fr 1fr}h1{font-size:30px}}
</style>
